/* App shell: one column (max 480px) that fills a phone and centres on larger screens. Everything inside uses NHS.UK frontend components; only the shell, tab bar, chat and chart are custom, built from NHS colours. Light-only, matching NHS services. */
:root{
  --nhs-blue:#005eb8; --nhs-dark:#003087; --nhs-text:#212b32; --nhs-sec:#4c6272; --nhs-g3:#aeb7bd; --nhs-g4:#d8dde0; --nhs-g5:#f0f4f5;
  --nhs-green:#007f3b; --nhs-yellow:#ffeb3b; --nhs-warm:#ffb81c; --nhs-red:#d5281b; --nhs-purple:#330072; --nhs-pale:#e8f1fa;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:#d8dde0;color:var(--nhs-text);font-family:"Frutiger W01",Arial,sans-serif}
.cc-shell{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--nhs-g5);position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--nhs-g4),0 20px 60px -30px rgba(0,48,135,.45)}
.cc-shell .nhsuk-header{flex:0 0 auto;padding-top:env(safe-area-inset-top,0px)}
.cc-hc{display:flex!important;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;margin-left:max(16px,env(safe-area-inset-left,0px))!important;margin-right:max(16px,env(safe-area-inset-right,0px))!important}
.cc-svc{color:#fff;display:flex;flex-direction:column;gap:2px;min-width:0}
.cc-svc b{font-size:19px;line-height:1.1}
.cc-svc span{font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-acc{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;background:var(--nhs-dark);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto}
.cc-pband{flex:0 0 auto;background:var(--nhs-dark);color:#fff;padding:8px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.cc-pband .nhsuk-back-link{margin:0 0 6px;font-size:16px}
.cc-prow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cc-pname{font-size:19px;font-weight:700;line-height:1.2}
.cc-pmeta{font-size:14px;opacity:.9;font-variant-numeric:tabular-nums}
.cc-pband .nhsuk-tag{margin:0;flex:0 0 auto}
.cc-tabs{flex:0 0 auto;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--nhs-g4)}

function langInfo(code){
 if(PB[code]) return {code,name:PB[code].n.split(' (')[0],full:PB[code].n,bcp:PB[code].c,rtl:!!PB[code].rtl,pb:PB[code]};
 const m=MORE.find(x=>x[1]===code||('x:'+x[0])===code); return m?{code:m[1],name:m[0],full:m[0],bcp:m[1],rtl:!!m[2]}:null;}
const ALL_LANGS=Object.keys(PB).map(langInfo).concat(MORE.filter(m=>m[1]!=='bsl').map(m=>langInfo(m[1]))).sort((a,b)=>a.code==='en'?-1:b.code==='en'?1:a.full.localeCompare(b.full));
/* Free-text translation: Claude when the app runs inside Claude, else the browser's on-device translator (Chrome), else none. */
const within=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
async function translateText(text,L){
 try{ if(window.claude&&typeof claude.use==='function'){ const sample=await claude.use('sample'); if(sample){
   const r=await sample(`Translate this question from an NHS clinician into ${L.name} for a patient aged over 60. Use plain, polite, everyday words a patient would understand. Keep medicine names and numbers exactly. Reply with the translation only, no notes.\n\nQuestion: ${text}`,{modelTier:'quick'});
   if(r&&r.text) return {text:r.text.trim(),via:'Claude'}; } } }catch(e){ if(e&&(e.code==='rate_limited')) return {err:'Too many translations just now. Try again in a minute.'}; }
 try{ if('Translator' in self){ const tl=L.bcp.split('-')[0]; const av=await within(self.Translator.availability({sourceLanguage:'en',targetLanguage:tl}),4000); if(av&&av!=='unavailable'){ const t=await within(self.Translator.create({sourceLanguage:'en',targetLanguage:tl}),20000); return {text:await within(t.translate(text),10000),via:'On-device translation'}; } } }catch(e){}
 return null;}

  if(unsure||saidNo) return {st:'con',dose:'Likely <b>10 mg</b>, not confirmed',why:saidNo?'The newest record says 10 mg, but Alex says the hospital didn’t change it. Confirm it another way below.':'The newest record says 10 mg, but Alex isn’t sure which dose he takes. Confirm it another way below.',lines:ctx.concat([home]).concat(evLines),srcs,
    sum:`The Royal London increased Alex’s amlodipine from 5 mg to 10 mg on 12 Oct. His GP record still says 5 mg, and Alex ${saidNo?'says it didn’t change':'isn’t sure which dose he takes'}. Check his tablets, call his son, or call the Royal London pharmacy to confirm.`+CTX};
  return {st:'con',dose:'Likely <b>10 mg</b> once daily',why:'The newest record says 10 mg. The older GP record says 5 mg. Ask Alex to confirm.',lines:ctx.concat([home]).concat(evLines),srcs,
    sum:'The Royal London increased Alex’s amlodipine from 5 mg to 10 mg on 12 Oct. His GP record in Bradford still says 5 mg. His home readings have dropped since, to 98/58 this morning, which may explain today’s fall. Confirm the dose with Alex.'+CTX};
}

/* Consent question: shown in English first. The clinician can switch it to the patient's language (checked phrasebook) or, for other languages, a marked machine translation. */
function langOptions(sel,pref){const o=(l)=>`<option value="${l.code}" ${l.code===sel?'selected':''}>${esc(l.full)}</option>`;
 const pb=Object.keys(PB).filter(c=>c!=='en'&&c!==pref).map(langInfo).sort((a,b)=>a.full.localeCompare(b.full));
 const mt=MORE.filter(m=>m[1]!=='bsl').map(m=>langInfo(m[1]));
 return o(langInfo('en'))+(pref&&pref!=='en'?`<optgroup label="Patient’s language">${o(langInfo(pref))}</optgroup>`:'')+`<optgroup label="Phrasebook">${pb.map(o).join('')}</optgroup><optgroup label="Machine translation (check with an interpreter)">${mt.map(o).join('')}</optgroup>`;}
function consentShown(p){const v=V(p.id),code=v.clang||'en',L=langInfo(code)||langInfo('en');
 if(code==='en') return {text:PB.en.consent,L,kind:'en'};
 if(PB[code]) return {text:PB[code].consent,L,kind:'pb'};
 const t=(v.ctrans||{})[code]; if(t&&t.text) return {text:t.text,L,kind:'mt',via:t.via};
 return {text:null,L,kind:t&&t.fail?'fail':'pending'};}
function consentBox(p){const v=V(p.id),c=consentShown(p),L=c.L,pref=p.lang;
 let body;
 if(c.kind==='en') body=`<p class="big" lang="en">${PB.en.consent}</p>`;
 else if(c.kind==='pending') body=`<p class="big" lang="en">${PB.en.consent}</p><p class="en">Translating into ${esc(L.name)}…</p>`;
 else if(c.kind==='fail') body=`<p class="big" lang="en">${PB.en.consent}</p><div class="nhsuk-inset-text" style="margin:8px 0 12px"><p>Can’t translate into ${esc(L.name)} on this device. Book a ${esc(L.name)} interpreter instead.</p></div><button class="nhsuk-button nhsuk-button--secondary nhsuk-button--small" data-a="interp:${esc(L.name)}">Book a ${esc(L.name)} interpreter</button>`;
 else body=`<p class="big" lang="${L.bcp}" ${L.rtl?'dir="rtl"':''}>${esc(c.text)}</p>${c.kind==='mt'?`<p style="margin:0 0 8px"><strong class="nhsuk-tag nhsuk-tag--orange">Machine translation · ${esc(c.via)}</strong></p>`:''}<p class="en" lang="en">English: ${PB.en.consent}</p>`;
 const showing=c.kind==='pb'||c.kind==='mt'?L.name:'English';
 return `<div class="cc-pf">
  <div class="cc-pf-top"><label class="nhsuk-label nhsuk-body-s" for="clang" style="margin:0">Show this question in</label>

  ${body}
  ${c.text||c.kind==='en'?`<button class="cc-linkbtn" data-a="speak:consent">${I.spk} Read aloud in ${esc(showing)}</button> ${pt('s')}`:''}</div>`;}
async function setConsentLang(code){const p=P(S.pid),v=V(p.id);v.clang=code;v.ctrans=v.ctrans||{};
 if(code!=='en'&&!PB[code]&&!(v.ctrans[code]&&v.ctrans[code].text)){v.ctrans[code]={pending:true};render(true);
  const r=await translateText(PB.en.consent,langInfo(code));v.ctrans[code]=r&&r.text?{text:r.text,via:r.via}:{fail:true};

function vConsent(p){

/* The services the agent reaches, each through its own open-source MCP server. */
/* How each connection is allowed. Patient data: open specification, controlled access, direct care only. Our MCP server code: open source. */
const CONN={
 pds:{name:'Personal Demographics Service',grp:'rec',kind:'Existing NHS England API',what:'identity and registered GP',how:'Open specification (FHIR). Access needs NHS England approval and a clinical smartcard role.',mcp:'pds.patient.read'},
 gpc:{name:'GP Connect',grp:'rec',kind:'Existing NHS England API',what:'GP medicines, problems and recent letters',how:'Open specification (FHIR). Already used by urgent care for direct care. Access needs NHS England approval and the practice’s data sharing agreement.'},
 scr:{name:'Summary Care Record',grp:'rec',kind:'Existing national record',what:'medicines and allergies from the GP record',how:'Used across England for direct care. Access through approved systems with a smartcard role.'},
 eps:{name:'Electronic Prescription Service',grp:'rec',kind:'Existing NHS England API',what:'what was prescribed and collected in the community',how:'Open specification. Access for approved care settings through the prescription tracker.'},
 lcr:{name:'London Care Record',grp:'rec',kind:'Regional shared care record',what:'hospital discharge summary',how:'Used by London health and care staff for direct care. Access agreed locally. Conceptual in this prototype.'},
 bp:{name:'Home BP monitor',grp:'pt',kind:'Patient-shared device',what:'blood pressure readings',how:'Shared by Alex at triage, by his choice. Treated as patient reported.'},
 dmd:{name:'NHS dictionary of medicines (dm+d)',grp:'pub',kind:'Open NHS reference data',what:'medicine names and strengths',how:'Published free by the NHS Business Services Authority. No patient data.',mcp:'dmd.lookup'},
 svc:{name:'NHS Service Search',grp:'pub',kind:'Public NHS directory',what:'phone numbers for the GP and hospital pharmacy',how:'Public information from the NHS website. No patient data.',mcp:'service-search.organisation.read'}
};
const GRP={rec:['Patient records','Needs NHS England approval and a smartcard role. Direct care only.'],pt:['Shared by the patient','Needs '+'the patient’s consent.'],pub:['Public NHS data','Open to anyone. No patient data.']};
const GSHORT={rec:'needs NHS approval',pt:'patient’s consent',pub:'public data'};
function allConns(p){return ['pds'].concat(p.sources.map(s=>s.id)).concat(p.meds.length?['dmd']:[]).concat(p.meds.some(m=>m.conflict)?['svc']:[]);}
function agentList(p,live){const fail=S.offline;
 const meta=id=>CONN[id]||{name:id,kind:'',what:''};
 const steps=[{t:'Checking consent',r:`${V(p.id).consent==='agree'?'Agreed':'Best interests recorded'} at ${V(p.id).consentAt}`,via:'Consent record',m:'policy.check · purpose=direct-care'},
  {t:'Confirming identity',r:`${p.name} · NHS ${p.nhs} · GP: ${p.gp}`,via:'Personal Demographics Service · existing NHS connection',m:'Proposed MCP adapter · pds.patient.read'}]
  .concat(p.sources.map(s=>({t:`Searching the ${s.name}`,r:(fail&&s.canFail)?'No answer after 8 seconds. Marked unavailable.':s.res,via:`${meta(s.id).name} · ${meta(s.id).kind}${s.id==='lcr'?' (conceptual)':''}`,m:'Proposed MCP adapter · '+s.mcp,fail:fail&&s.canFail})))
  .concat(p.meds.some(m=>m.conflict)?[{t:'Finding contact numbers',r:'Royal London pharmacy and Westfield Road Surgery',via:'NHS Service Search · public NHS directory',m:'Proposed MCP adapter · service-search.organisation.read'}]:[])
  .concat(p.meds.length?[{t:'Matching medicine names',r:`${p.meds.length} medicines matched across sources`,via:'NHS dictionary of medicines (dm+d) · open reference data',m:'Proposed MCP adapter · dmd.lookup'}]:[])
  .concat([{t:'Comparing sources',r:p.meds.some(m=>m.conflict)?'1 medicine needs your decision':'All sources agree',via:'AI agent · nothing stored',m:'agent.compare'}]);
 return steps.map((s,i)=>`<div class="cc-step ${live?'wait':(s.fail?'fail':'done')}" id="st${i}" data-fail="${s.fail?1:0}"><span class="ic">${live?'':(s.fail?I.x:I.check)}</span><div><b>${s.t}</b><span class="nhsuk-body-s" style="display:block;margin:0;color:#003087;font-weight:700">${esc(s.via)}</span><span class="res">${live?'':esc(s.r)}</span><span class="r" hidden>${esc(s.r)}</span><div><code class="cc-mcp">${s.m}</code></div></div></div>`).join('');}
function vLoading(p){const names=allConns(p).map(id=>CONN[id].name);
 return `<div class="nhsuk-card"><div class="nhsuk-card__content">
  <h2 class="nhsuk-card__heading nhsuk-heading-m">Searching ${p.first}’s records ${pt('c')}</h2>
  <p class="nhsuk-body-s">The AI agent searches ${names.length} sources, each through a proposed open-source MCP adapter that would run inside the NHS network (no third-party plugin), and asks only for what this visit needs:</p>
  <ul class="nhsuk-list nhsuk-list--bullet nhsuk-body-s">${allConns(p).map(id=>`<li style="margin-bottom:2px">${CONN[id].name} <span style="color:#4c6272">· ${GSHORT[CONN[id].grp]}</span></li>`).join('')}</ul>${agentList(p,true)}</div></div>`;}

function bpChart(){const W=320,H=150,l=34,r=10,t=14,b=26,ymin=50,ymax=160;
 const X=i=>l+i*(W-l-r)/(BP.length-1), Y=v=>t+(ymax-v)*(H-t-b)/(ymax-ymin);
 const grid=[60,90,120,150].map(v=>`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#d8dde0"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#4c6272">${v}</text>`).join('');
 const sys=BP.map((d,i)=>`${X(i)},${Y(d[1])}`).join(' '), dia=BP.map((d,i)=>`${X(i)},${Y(d[2])}`).join(' ');
 const cut=(X(3)+X(4))/2, last=BP.length-1;
 return `<svg class="cc-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Home blood pressure from 1 to 30 October. About 147 over 89 before 12 October, about 113 over 67 after, and 98 over 58 this morning.">
  ${grid}<line x1="${cut}" x2="${cut}" y1="${t}" y2="${H-b}" stroke="#005eb8" stroke-dasharray="4 3"/>
  <text x="${cut+4}" y="${t+8}" font-size="10" font-weight="700" fill="#005eb8">Dose changed 12 Oct</text>
  <polyline points="${sys}" fill="none" stroke="#003087" stroke-width="2.5"/><polyline points="${dia}" fill="none" stroke="#41b6e6" stroke-width="2.5"/>
  ${BP.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d[1])}" r="2.5" fill="#003087"/><circle cx="${X(i)}" cy="${Y(d[2])}" r="2.5" fill="#41b6e6"/>`).join('')}
  <circle cx="${X(last)}" cy="${Y(BP[last][1])}" r="5" fill="#d5281b"/><text x="${X(last)-6}" y="${Y(BP[last][1])-9}" text-anchor="end" font-size="11" font-weight="700" fill="#d5281b">98/58 today</text>
  <text x="${l}" y="${H-8}" font-size="10" fill="#4c6272">1 Oct</text><text x="${W-r}" y="${H-8}" font-size="10" fill="#4c6272" text-anchor="end">30 Oct</text></svg>
  <p class="nhsuk-body-s" style="margin:8px 0 0"><span style="color:#003087;font-weight:700">Systolic</span> and <span style="color:#1d7fa8;font-weight:700">diastolic</span>, mmHg. Average 147/89 before the change, 113/67 after.</p>`;}

function vOverview(p){const v=V(p.id);
 if(v.closed) return vClosed(p);
 if(!v.consent) return vConsent(p);
 if(v.load!=='done') return vLoading(p);
 const meds=medsOf(p), conf=meds.find(m=>m.conflict);
 const sum=conf?conf.sum:(p.id==='margaret'?'All sources agree on Margaret’s three medicines. She takes donepezil for dementia, so her own account may be incomplete. She has had 2 falls this year. Her daughter Grace is listed as next of kin.':'No regular medicines or allergies on record.');
 const oc=obsCalc(v.obs);
 const sum2=sum+(v.obs&&oc.postural?` In clinic today, systolic fell by ${oc.drop} mmHg on standing (${v.obs.lsys}/${v.obs.ldia} lying, ${v.obs.ssys}/${v.obs.sdia} standing), which fits low blood pressure.`:'');
 let html=`<div class="nhsuk-card cc-ai"><div class="nhsuk-card__content"><div class="cc-ai-lab">${I.spark} AI summary · check before acting ${pt('s')}</div><p class="nhsuk-body" style="margin:0">${sum2}</p>
  <p class="nhsuk-body-s" style="margin:8px 0 0;color:#4c6272">Every sentence comes from the records below. The agent compares records. It doesn’t add facts.</p></div></div>`;
 html+=`<div class="nhsuk-card"><div class="nhsuk-card__content"><h2 class="nhsuk-card__heading nhsuk-heading-m">Records checked ${pt('c')}</h2>
  <p class="nhsuk-body-s" style="margin:0 0 4px">At ${v.searchedAt||v.consentAt}, through ${allConns(p).length} proposed MCP adapters: ${allConns(p).map(id=>CONN[id].name).join(', ')}.</p>
  <details class="nhsuk-details" style="margin:8px 0 12px"><summary class="nhsuk-details__summary"><span class="nhsuk-details__summary-text">Show each check</span></summary><div class="nhsuk-details__text">${agentList(p,false)}</div></details>

function takeHome(p,lang){const v=V(p.id);
 const dose=v.decision?v.decision.val:null;
 if(p.id!=='alex') return '';
 if(dose!=='10'&&dose!=='unsure') return `<div class="nhsuk-inset-text"><span class="nhsuk-u-visually-hidden">Information: </span><p>Record a decision first: 10 mg, or “Not sure yet”. The summary only states what you’ve confirmed.</p></div>`;
 const keys=dose==='10'?['s1','s2','s3']:['s4','s5','s3'];const L=PB[lang]&&PB[lang][keys[0]]?PB[lang]:PB.en;
 return `<div class="cc-take" ${L.rtl?'dir="rtl"':''} lang="${L.c}">${keys.map(k=>`<p class="line">${L[k]}</p>${L!==PB.en?`<p class="en" dir="ltr" lang="en">${PB.en[k]}</p>`:''}`).join('')}</div>
  <button class="nhsuk-button nhsuk-button--secondary" data-a="print">Print for ${p.first}</button> ${pt('s')}`;}

function vTalk(p){const v=V(p.id);

 let h=`<span class="nhsuk-caption-m">Turn the screen to ${p.first} ${pt('f')}</span>
  <div class="nhsuk-form-group"><label class="nhsuk-label nhsuk-label--s" for="lang">Language</label><div class="nhsuk-hint" id="lang-hint">${Object.keys(PB).length} languages have checked questions. For any other language, the app books an interpreter.</div><select class="nhsuk-select" id="lang" aria-describedby="lang-hint" data-a="lang">${opts}</select></div>`;
 if(interpOnly){const nm=lang.slice(2);
  h+=`<div class="nhsuk-card nhsuk-card--warning"><div class="nhsuk-card__content"><h3 class="nhsuk-card__heading">No checked questions in ${esc(nm)} yet</h3><p>Use a professional interpreter rather than an unchecked translation.</p>
   ${v.interp?`<p><b>${esc(nm)} interpreter requested at ${v.interpAt}.</b> Typical wait: 10 minutes by phone.</p>`:`<button class="nhsuk-button nhsuk-button--secondary" data-a="interp:${esc(nm)}">Book a ${esc(nm)} interpreter</button>`} ${pt('s')}</div></div>`;
  return h+customSection(p);}
 const qs=p.talk?p.talk.map(k=>({id:k,t:L[k],en:PB.en[k]})):p.talkEn.map((t,i)=>({id:'q'+(i+1),t:lang==='en'?t:null,en:t}));
 if(qs.some(q=>!q.t)){h+=`<div class="nhsuk-inset-text"><span class="nhsuk-u-visually-hidden">Information: </span><p>${p.first}’s checked questions are in English only. Switch to English, ask your own question below, or book an interpreter.</p></div>`;return h+customSection(p);}
 h+=`<h1 class="nhsuk-heading-m" ${L.rtl?'dir="rtl"':''} lang="${L.c}">${L.tap}</h1>`;
 h+=qs.map(q=>`<div class="cc-pf" ${L.rtl?'dir="rtl"':''} lang="${L.c}"><p class="big">${q.t}</p>${lang!=='en'?`<p class="en" dir="ltr" lang="en">${q.en}</p>`:''}
   <div class="cc-ans">${['yes','no','dk'].map(a=>`<button data-a="ans:${q.id}:${a}" aria-pressed="${v.answers[q.id]===a}">${L[a]}${lang!=='en'?`<small>${PB.en[a]}</small>`:''}</button>`).join('')}</div>
   <button class="cc-linkbtn" data-a="speak:${q.id}">${I.spk} Read aloud</button></div>`).join('');
 if(p.id==='alex'){
  const m=medsOf(p).find(x=>x.conflict);
  h+=`<div class="nhsuk-card"><div class="nhsuk-card__content"><h2 class="nhsuk-card__heading nhsuk-heading-s">What this changes</h2><p class="nhsuk-body" style="margin:0">Amlodipine is now ${tag(m.st)}. ${m.why}</p>${m.st==='ver'&&!v.decision?`<a href="#overview" class="nhsuk-action-link" data-a="tab:overview" style="margin:12px 0 0">${I.arrow}<span class="nhsuk-action-link__text">Record your decision</span></a>`:''}${m.st!=='ver'&&!v.decision&&(v.answers.q1||v.answers.q2)?`<a href="#overview" class="nhsuk-action-link" data-a="goconfirm" style="margin:12px 0 0">${I.arrow}<span class="nhsuk-action-link__text">Confirm the dose another way</span></a>`:''}</div></div>`;

function answerFor(p,q){q=q.toLowerCase().replace(/’/g,"'");const off=S.offline;
 if(p.id==='alex'&&/(not sure|isn't sure|doesn't know|don't know|dont know|can't remember|cant remember|unsure|forgot|what now|next step|confirm)/.test(q)){const ev=V(p.id).confirm||{};const done=Object.keys(ev).map(k=>EVN[k]+': '+ev[k].label).join('; ');
  return {text:'If Alex isn’t sure, confirm the dose another way, in this order. 1. Look at his tablets: the pharmacy label shows the strength. 2. Call his son Imran. 3. Call the Royal London pharmacy, which supplied the new dose on 12 Oct. 4. Call his GP practice in Bradford. If no one can confirm it today, keep the dose unconfirmed, ask his GP to confirm it with the Royal London, and give Alex an Urdu summary asking him to take all his tablets to his GP.'+(done?' Done so far: '+done+'.':''),src:['London Care Record','Summary Care Record','NHS service directory']};}
 const src=ids=>ids.map(id=>{const s=p.sources.find(x=>x.id===id);return s&&!(off&&s.canFail)?s.name:null}).filter(Boolean);
 if(/allerg/.test(q)) return {text:p.allergies.map(a=>a[0]+(a[1]?' ('+a[1].toLowerCase()+')':'')).join(', ')+'. From the GP record. Nothing else conflicts.',src:['Summary Care Record']};
 if(/blood pressure|bp|reading|dizz|low/.test(q)&&p.id==='alex') {const o=V(p.id).obs,c=obsCalc(o);return {text:'Home readings averaged 147/89 before 12 Oct and 113/67 after. This morning it was 98/58, before the fall.'+(o&&o.lsys?` In clinic: ${obsLine(o)}.${c.postural?' That is a postural drop.':''}`:' These are patient-reported, so check lying and standing blood pressure.'),src:['Home BP monitor'].concat(o&&o.lsys?['Today’s checks']:[])};}
 if(/fall|fell/.test(q)){const f=p.other.find(o=>o[0]==='Falls history');return {text:f?f[1]+'.':'No falls history available.',src:src(['scr','lcr'])};}
 if(/kin|family|son|daughter|contact|who/.test(q)){const n=p.other.find(o=>o[0]==='Next of kin');return {text:n?n[1]+'.':'No next of kin on record.',src:n&&n[2]==='ver'?['Summary Care Record']:[]};}
 if(/med|tablet|pill|dose|drug|change|amlodipine|taking|hospital/.test(q)){const c=medsOf(p).find(m=>m.conflict);return {text:c?c.sum:'All medicines agree across sources: '+p.meds.map(m=>m.name+' '+m.dose).join('; ')+'.',src:src(p.sources.map(s=>s.id))};}
 return {text:'I can answer about medicines, blood pressure, allergies, falls and next of kin.',src:[]};}

function vAsk(p){const v=V(p.id);

 const chips=p.id==='alex'?['What changed with Alex’s medicines?','Alex isn’t sure of his dose. What now?','Why might he have fallen?','Any allergies?']:['What medicines are they on?','Any allergies?','Any falls before?','Who is next of kin?'];

function vLog(p){const items=LOG.filter(e=>e.pid===p.id);

  <div class="nhsuk-inset-text"><span class="nhsuk-u-visually-hidden">Information: </span><p>Example sources, not live connections. The NHS connections are real services with open specifications and controlled access. The MCP adapters that reach them are proposed, not yet built, and would be open-source code, as the NHS service standard asks for new code. Every request is for direct care, after consent, and logged. They run inside the NHS network, not as a third-party plugin. Records stay in their own systems and this device keeps nothing after the visit.</p></div>`;}

function summaryList(p){const v=V(p.id),lab={yes:'Yes',no:'No',dk:'Not sure'};

function vClosed(p){const v=V(p.id);

const OBS=[['height','Height','cm',50,250],['weight','Weight','kg',20,300],['lsys','Systolic','mmHg',50,250],['ldia','Diastolic','mmHg',30,150],['ssys','Systolic','mmHg',50,250],['sdia','Diastolic','mmHg',30,150],['pulse','Pulse','bpm',30,220],['temp','Temperature','°C',33,43],['spo2','Oxygen saturation','%',50,100],['glucose','Blood glucose','mmol/L',1,40]];
const OBSN=Object.fromEntries(OBS.map(o=>[o[0],o]));
const LONG={lsys:'Lying systolic',ldia:'Lying diastolic',ssys:'Standing systolic',sdia:'Standing diastolic'};
function obsCalc(o){const r={};if(!o)return r;if(o.height&&o.weight)r.bmi=(o.weight/((o.height/100)**2)).toFixed(1);
 if(o.lsys&&o.ssys){r.drop=o.lsys-o.ssys;r.ddrop=(o.ldia&&o.sdia)?o.ldia-o.sdia:null;r.postural=r.drop>=20||(r.ddrop!=null&&r.ddrop>=10);}return r;}
function obsLine(o){if(!o)return '';const c=obsCalc(o),p=[];
 if(o.lsys)p.push(`Lying ${o.lsys}/${o.ldia||'?'}`);if(o.ssys)p.push(`standing ${o.ssys}/${o.sdia||'?'}${c.drop!=null?` (drop ${c.drop})`:''}`);
 if(o.pulse)p.push(`pulse ${o.pulse}`);if(o.temp)p.push(`${o.temp}°C`);if(o.spo2)p.push(`SpO2 ${o.spo2}%`);if(o.glucose)p.push(`glucose ${o.glucose}`);if(c.bmi)p.push(`BMI ${c.bmi}`);return p.join(' · ');}
function field(id,v,err,width){const o=OBSN[id];const e=err&&err[id];

/* Read aloud: waits for the device's voices, picks a voice that really speaks the language (never an English voice reading Urdu), reads long text in short chunks, and says plainly when the device has no voice for a language. Tap again to stop. */
const VOICE_ALIAS={yue:['zh-HK','yue'],prs:['fa','prs'],pnb:['pnb'],ckb:['ckb','ku'],tl:['fil','tl'],he:['he','iw'],id:['id','in'],no:['nb','no'],zh:['zh-CN','zh']};
function voicesReady(){return new Promise(res=>{const v=speechSynthesis.getVoices();if(v.length)return res(v);let d=false;const f=()=>{if(d)return;d=true;res(speechSynthesis.getVoices());};speechSynthesis.addEventListener('voiceschanged',f,{once:true});setTimeout(f,1500);});}
function pickVoice(vs,lang){const want=String(lang).toLowerCase().replace('_','-'),base=want.split('-')[0];
 const tags=[want].concat((VOICE_ALIAS[base]||[base]).map(x=>x.toLowerCase()));
 const norm=x=>x.lang.toLowerCase().replace('_','-');
 const score=x=>{const l=norm(x);let s=-1;tags.forEach((t,i)=>{if(l===t)s=Math.max(s,100-i*2);else if(l.split('-')[0]===t.split('-')[0])s=Math.max(s,50-i*2);});if(s<0)return -1;
  return s+(/natural|neural|enhanced|premium|google/i.test(x.name)?5:0)+(base==='en'&&l==='en-gb'?8:0);};
 return vs.map(x=>[score(x),x]).filter(a=>a[0]>=0).sort((a,b)=>b[0]-a[0]).map(a=>a[1])[0]||null;}
function chunkText(t){const parts=String(t).match(/[^.!?؟۔।。！？]+[.!?؟۔।。！？]*\s*/g)||[String(t)];const out=[];let cur='';
 parts.forEach(x=>{if(cur&&(cur+x).length>180){out.push(cur);cur=x;}else cur+=x;});if(cur.trim())out.push(cur);return out;}
let speakingId=null;
async function speak(text,lang,id){try{
 if(!('speechSynthesis' in window)||!text) return toast('Read aloud isn’t available on this device');
 if(speakingId&&speakingId===(id||text)&&speechSynthesis.speaking){speechSynthesis.cancel();speakingId=null;return toast('Stopped reading');}
 const vs=await voicesReady(),base=String(lang).split('-')[0].toLowerCase(),li=langInfo(base)||{name:base==='en'?'English':lang};
 const voice=pickVoice(vs,lang);
 if(!voice&&base!=='en') return toast(`This device has no ${li.name} voice. Show the text or use an interpreter.`);
 speechSynthesis.cancel();speakingId=id||text;
 const parts=chunkText(text);
 parts.forEach((c,i)=>{const u=new SpeechSynthesisUtterance(c);if(voice){u.voice=voice;u.lang=voice.lang;}else u.lang=lang;u.rate=.9;
  if(i===parts.length-1){u.onend=()=>{speakingId=null;};u.onerror=()=>{speakingId=null;};}speechSynthesis.speak(u);});
 toast(`Reading aloud in ${li.name}`);
}catch(e){toast('Read aloud isn’t available on this device');}}
if('speechSynthesis' in window){try{speechSynthesis.getVoices();}catch(e){}}

   render(); break;
  case 'src': v.open[b]=!v.open[b]; render(true); break;
  case 'retry': toast('Still no answer from the London Care Record'); log(p.id,'Retried London Care Record','No answer','System'); render(true); break;
  case 'undo': v.decision=null; render(true); break;
  case 'chip': ask(rest); break;
  case 'mic': if(listening)break; listening=true; render(); timers.push(setTimeout(()=>{listening=false;ask(p.id==='alex'?'What changed with Alex’s medicines?':'What medicines are they on?');},1400)); break;
  case 'ans': {v.answers[b]=c;tick(1);v.answers.at=tm();const en=p.talk?PB.en[b]:p.talkEn[+b.slice(1)-1];log(p.id,'Patient answered',`${en} ${({yes:'Yes',no:'No',dk:'Not sure'})[c]}`,p.name+' (patient)');render(true);} break;
  case 'clangq': setConsentLang(b); break;
  case 'speak': {const lang=v.lang||p.lang,L=PB[lang]||PB.en; if(b==='consent'){const c=consentShown(p);speak(c.text||PB.en.consent,c.text?c.L.bcp:'en-GB','consent');} else speak(p.talk?L[b]:p.talkEn[+b.slice(1)-1],p.talk?L.c:'en-GB');} break;
  case 'interp': tick(1); v.interp=true; v.interpAt=tm(); log(p.id,'Interpreter requested',rest+' interpreter, by phone'); toast(rest+' interpreter requested'); render(true); break;
  case 'print': log(p.id,'Visit summary printed',`In ${(PB[v.lang||p.lang]||PB.en).n.split(' (')[0]} and English`); v.todos[2]=true; toast('Sent to the printer'); render(true); break;
  case 'obs-example': v.obsDraft={height:172,weight:76,lsys:128,ldia:76,ssys:102,sdia:64,pulse:82,temp:36.7,spo2:97,glucose:6.4,notes:'Felt light-headed when standing. No head injury. Walks with a stick.'};v.obsErr=null;v.obsSaved=false;render(true);break;
  case 'cq-speak-en': {const t=(document.getElementById('cq-en')||{}).value;if(t&&t.trim())speak(t.trim(),'en-GB');else toast('Type a question first');} break;
  case 'cq-speak': {const q=v.custom.find(x=>x.id===b);if(q)speak(q.text,q.bcp,'cq'+q.id);} break;
  case 'cq-edit': {const q=v.custom.find(x=>x.id===b);if(q)q.editing=true;render(true);} break;
  case 'cq-cancel': {const q=v.custom.find(x=>x.id===b);if(q)q.editing=false;render(true);} break;
  case 'cq-save': {const q=v.custom.find(x=>x.id===b),ta=document.getElementById('cqe-'+b);if(q&&ta&&ta.value.trim()){q.text=ta.value.trim();q.status='edited';q.editing=false;tick(1);log(p.id,'Translation corrected',`${q.langName}: “${q.en}”`);}render(true);} break;
  case 'cq-del': v.custom=v.custom.filter(x=>x.id!==b); render(true); break;
  case 'cq-ans': {const q=v.custom.find(x=>x.id===b);if(q){q.answer=c;tick(1);log(p.id,'Patient answered',`${q.en} ${({yes:'Yes',no:'No',dk:'Not sure'})[c]}`,p.name+' (patient)');}render(true);} break;
  case 'research': tick(1); v.load='loading'; v.searchedAt=tm(); log(p.id,'Records searched again through MCP adapters',allConns(p).map(id=>CONN[id].name).join(', '),'AI agent for Priya Shah'); S.tab='overview'; render(); break;
  case 'cf': {const st=CONFIRM.find(x=>x.k===b),op=st.opts.find(x=>x[0]===c);tick(1);v.confirm=v.confirm||{};v.confirm[b]={v:c,label:op[1],at:tm()};log(p.id,'Dose check',`${EVN[b]}: ${op[1]}`);const m=amlodipine(p);toast(m.st==='ver'?'Amlodipine now Verified':`Recorded: ${op[1]}`);render(true);const el=document.getElementById('confirm');if(el&&m.st==='ver'){const d=document.getElementById('decide');if(d)d.scrollIntoView({block:'start'});}} break;
  case 'cf-clear': delete v.confirm[b]; render(true); break;
  case 'safeplan': tick(1); v.decision={val:'unsure',label:'Dose unconfirmed. GP asked to confirm',at:tm(),reason:'Could not confirm with Alex, his family or the hospital today.'}; log(p.id,'Safe plan used','Dose kept unconfirmed. GP to confirm with the Royal London. Urdu summary for Alex.'); toast('Plan recorded'); render(true); break;
  case 'goconfirm': S.tab='overview'; render(); {const el=document.getElementById('confirm'); if(el) el.scrollIntoView({block:'start'});} break;
  case 'finish': sheet=finishSheet; render(true); break;
  case 'sheet-close': sheet=null; render(true); break;
  case 'send': tick(2); v.sent=true; v.sentAt=tm(); log(p.id,'Summary sent to GP',p.gp); render(true); break;
  case 'close': tick(1); v.closed=true; v.closedAt=tm(); log(p.id,'Visit finished','Access to other services’ records ended'); sheet=null; S.view='patients'; render(); toast(p.name+'’s visit finished'); break;
  case 'reopen': S.v[p.id]=visit(); S.tab='overview'; render(); break;
  case 'reset': {const keep={labels:S.labels,large:S.large,offline:S.offline}; S={...fresh(),...keep,view:'settings'}; LOG=[]; render(); toast('All visits reset');} break;
 }});
document.addEventListener('change',e=>{const el=e.target.closest('[data-a]');if(!el)return;const [k,b]=el.dataset.a.split(':');
 if(k==='set'){S[b]=el.checked;render(true);}
 if(k==='filter'){S.filter=b;render();}
 if(k==='todo'){V(S.pid).todos[b]=el.checked;save();}
 if(k==='lang'){V(S.pid).lang=el.value;V(S.pid).interp=false;render(true);}
 if(k==='clang'){setConsentLang(el.value);} });
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){sheet=null;render(true);}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['patients','activity','settings'].includes(h)&&h!==S.view){S.view=h;sheet=null;render();}});
if(location.hash&&location.hash!=='#patients'){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
render();
})();
</script>
